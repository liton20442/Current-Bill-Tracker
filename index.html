<script>

const KEY="currentBillTrackerV1";


/* =========================
   DEFAULT DATABASE
========================= */

let db={

  meters:[
    {
      id:"m1",
      name:"মিটার–১",
      number:"",
      opening:0,
      openingDate:todayISO()
    },
    {
      id:"m2",
      name:"মিটার–২",
      number:"",
      opening:0,
      openingDate:todayISO()
    }
  ],

  rates:[
    {from:0,to:50,rate:5},
    {from:51,to:75,rate:6},
    {from:76,to:100,rate:7},
    {from:101,to:150,rate:8},
    {from:151,to:200,rate:9}
  ],

  readings:[],

  charges:{
    energy:42,
    rent:10
  },

  vat:[]

};


/* =========================
   DATE FUNCTIONS
========================= */

function todayISO(){

  const d=new Date();

  const local=new Date(
    d.getTime()-d.getTimezoneOffset()*60000
  );

  return local.toISOString().slice(0,10);

}


function monthISO(){

  return todayISO().slice(0,7);

}


/* =========================
   NUMBER FORMAT
========================= */

function money(n){

  return Number(n||0).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:0
    }
  );

}


function fmtNum(n){

  return Number(n||0).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:2
    }
  );

}


/* =========================
   DATABASE LOAD / SAVE
========================= */

function loadDB(){

  try{

    const saved=localStorage.getItem(KEY);

    if(saved){

      const parsed=JSON.parse(saved);

      db=Object.assign(db,parsed);

    }

  }catch(e){

    console.error(e);

  }


  if(!db.meters)
    db.meters=[];

  if(!db.rates)
    db.rates=[];

  if(!db.readings)
    db.readings=[];

  if(!db.vat)
    db.vat=[];

  if(!db.charges)
    db.charges={};

  if(
    db.charges.energy===undefined ||
    db.charges.energy===null
  )
    db.charges.energy=42;

  if(
    db.charges.rent===undefined ||
    db.charges.rent===null
  )
    db.charges.rent=10;

}


function saveDB(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}


/* =========================
   BASIC HELPERS
========================= */

function meter(id){

  return db.meters.find(
    m=>m.id===id
  );

}


function readingsFor(id){

  return db.readings
    .filter(r=>r.meterId===id)
    .sort(
      (a,b)=>
        a.date.localeCompare(b.date) ||
        a.createdAt-b.createdAt
    );

}


function getOpening(m){

  return Number(m?.opening)||0;

}


/* =========================
   RATE BILL
========================= */

function billForUnits(units){

  units=Math.max(
    0,
    Number(units)||0
  );

  let remaining=units;
  let total=0;

  const sorted=[
    ...db.rates
  ].sort(
    (a,b)=>
      Number(a.from)-Number(b.from)
  );


  for(const r of sorted){

    if(remaining<=0)
      break;

    const from=Number(r.from);
    const to=Number(r.to);
    const rate=Number(r.rate);

    if(
      to<from ||
      rate<0
    )
      continue;

    const capacity=
      to===999999999
      ? Infinity
      : to-from+1;

    const use=Math.min(
      remaining,
      capacity
    );

    if(use>0){

      total+=use*rate;

      remaining-=use;

    }

  }


  if(
    remaining>0 &&
    sorted.length
  ){

    const last=
      sorted[sorted.length-1];

    total+=
      remaining*
      Number(last.rate);

  }


  return total;

}


/* =========================
   VAT
========================= */

function vatKey(meterId,month){

  return meterId+"_"+month;

}


function getVAT(meterId,month){

  const item=db.vat.find(
    x=>
      x.meterId===meterId &&
      x.month===month
  );

  return item
    ? Number(item.amount)||0
    : 0;

}


/* =========================
   MONTH LIST
========================= */

function monthsBetween(startDate,endDate){

  const result=[];

  if(!startDate || !endDate)
    return result;

  const start=new Date(
    startDate+"T00:00:00"
  );

  const end=new Date(
    endDate+"T00:00:00"
  );

  let y=start.getFullYear();
  let m=start.getMonth();

  const ey=end.getFullYear();
  const em=end.getMonth();


  while(
    y<ey ||
    (y===ey && m<=em)
  ){

    result.push(
      y+
      "-"+
      String(m+1).padStart(2,"0")
    );

    m++;

    if(m>11){

      m=0;
      y++;

    }

  }

  return result;

}


/* =========================
   MONTHS WITH READING
========================= */

function monthsUsedByMeter(id){

  const arr=readingsFor(id);

  const set=new Set();

  arr.forEach(
    r=>set.add(r.date.slice(0,7))
  );

  return [...set].sort();

}


/* =========================
   FIXED CHARGE
========================= */

function fixedCharge(){

  return (
    Number(db.charges.energy)||0
  )+
  (
    Number(db.charges.rent)||0
  );

}


function fixedChargeForMeter(id,date){

  if(!date)
    return 0;

  const months=
    monthsUsedByMeter(id);

  const month=
    date.slice(0,7);

  if(
    months.includes(month)
  ){

    return fixedCharge();

  }

  return 0;

}


/* =========================
   CUMULATIVE BILL
========================= */

function calculateMeterBill(id,date){

  const m=meter(id);

  if(!m)
    return {
      units:0,
      unitBill:0,
      fixed:0,
      vat:0,
      actual:0
    };


  const arr=
    readingsFor(id)
      .filter(
        r=>r.date<=date
      );


  if(!arr.length){

    return {
      units:0,
      unitBill:0,
      fixed:0,
      vat:0,
      actual:0
    };

  }


  const last=
    arr[arr.length-1];


  const units=Math.max(
    0,
    Number(last.reading)-
    getOpening(m)
  );


  const unitBill=
    billForUnits(units);


  const months=
    monthsUsedByMeter(id)
      .filter(
        x=>x<=date.slice(0,7)
      );


  const fixed=
    months.length*
    fixedCharge();


  let vat=0;

  months.forEach(
    month=>{
      vat+=getVAT(
        id,
        month
      );
    }
  );


  const actual=
    unitBill+
    fixed+
    vat;


  return {
    units,
    unitBill,
    fixed,
    vat,
    actual
  };

}


/* =========================
   DAILY UNIT
========================= */

function dailyUnit(id,date){

  const arr=
    readingsFor(id)
      .filter(
        r=>r.date<=date
      );

  if(!arr.length)
    return 0;

  const i=
    arr.findIndex(
      r=>r.date===date
    );

  if(i<0)
    return 0;

  const prev=
    i===0
    ? getOpening(meter(id))
    : Number(arr[i-1].reading);

  return Math.max(
    0,
    Number(arr[i].reading)-prev
  );

}


/* =========================
   LATEST
========================= */

function latest(id){

  const arr=
    readingsFor(id);

  return arr.length
    ? arr[arr.length-1]
    : null;

}


/* =========================
   SELECT BOXES
========================= */

function populateMeterSelects(){

  const html=
    db.meters.map(
      m=>
        `<option value="${m.id}">
          ${esc(m.name)}
          ${m.number
            ?" — "+esc(m.number)
            :""
          }
        </option>`
    ).join("");


  document.getElementById(
    "readingMeter"
  ).innerHTML=html;


  document.getElementById(
    "historyMeter"
  ).innerHTML=html;


  document.getElementById(
    "vatMeter"
  ).innerHTML=html;

}


/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

  const box=
    document.getElementById(
      "dashboardMeters"
    );


  box.innerHTML=
    db.meters.map(
      m=>{

        const last=
          latest(m.id);

        const data=
          last
          ? calculateMeterBill(
              m.id,
              last.date
            )
          : {
              units:0,
              unitBill:0,
              fixed:0,
              vat:0,
              actual:0
            };


        const todayUnit=
          last &&
          last.date===todayISO()
          ? dailyUnit(
              m.id,
              last.date
            )
          : 0;


        return `

        <div
          class="card"
          style="
            background:#f8fbfb;
            margin:10px 0 0;
            box-shadow:none;
            border:1px solid #e2eeee
          "
        >

          <div class="meter-title">

            <h3>
              ${esc(m.name)}
            </h3>

            <span class="badge">
              ${
                esc(
                  m.number ||
                  "মিটার নম্বর নেই"
                )
              }
            </span>

          </div>


          <div class="stats">

            <div class="stat">
              <small>Opening Reading</small>
              <strong>
                ${fmtNum(m.opening)}
              </strong>
            </div>


            <div class="stat">
              <small>বর্তমান Reading</small>
              <strong>
                ${
                  last
                  ? fmtNum(last.reading)
                  : fmtNum(m.opening)
                }
              </strong>
            </div>


            <div class="stat">
              <small>ব্যবহৃত Unit</small>
              <strong>
                ${fmtNum(data.units)}
              </strong>
            </div>


            <div class="stat">
              <small>আজকের Unit</small>
              <strong>
                ${fmtNum(todayUnit)}
              </strong>
            </div>


            <div class="stat">
              <small>Unit Bill</small>
              <strong>
                ${money(data.unitBill)}
              </strong>
            </div>


            <div class="stat">
              <small>Energy Charge</small>
              <strong>
                ${money(
                  data.fixed
                  ? db.charges.energy
                  : 0
                )}
              </strong>
            </div>


            <div class="stat">
              <small>Meter Rent</small>
              <strong>
                ${money(
                  data.fixed
                  ? db.charges.rent
                  : 0
                )}
              </strong>
            </div>


            <div class="stat">
              <small>VAT</small>
              <strong>
                ${money(data.vat)}
              </strong>
            </div>


            <div class="stat">
              <small>Actual Bill</small>
              <strong>
                ${money(data.actual)}
              </strong>
            </div>


            <div class="stat">
              <small>শেষ তারিখ</small>
              <strong
                style="font-size:16px"
              >
                ${
                  last
                  ? formatDate(last.date)
                  : "-"
                }
              </strong>
            </div>

          </div>

        </div>

        `;

      }
    ).join("");


  let totalUnits=0;
  let totalUnitBill=0;
  let totalFixed=0;
  let totalVat=0;
  let totalBill=0;
  let lastDate="";


  db.meters.forEach(
    m=>{

      const l=
        latest(m.id);

      if(l){

        const data=
          calculateMeterBill(
            m.id,
            l.date
          );


        totalUnits+=data.units;
        totalUnitBill+=data.unitBill;
        totalFixed+=data.fixed;
        totalVat+=data.vat;
        totalBill+=data.actual;


        if(
          l.date>lastDate
        )
          lastDate=l.date;

      }

    }
  );


  document.getElementById(
    "totalUnits"
  ).textContent=
    fmtNum(totalUnits);


  document.getElementById(
    "totalUnitBill"
  ).textContent=
    money(totalUnitBill);


  document.getElementById(
    "totalFixed"
  ).textContent=
    money(totalFixed);


  document.getElementById(
    "totalVat"
  ).textContent=
    money(totalVat);


  document.getElementById(
    "totalBill"
  ).textContent=
    money(totalBill);


  document.getElementById(
    "lastUpdate"
  ).textContent=
    lastDate
    ? formatDate(lastDate)
    : "-";

}


/* =========================
   READING PREVIEW
========================= */

function renderPreview(){

  const id=
    document.getElementById(
      "readingMeter"
    ).value;


  const m=
    meter(id);

  const last=
    latest(id);


  if(!m){

    document.getElementById(
      "readingPreview"
    ).innerHTML="";

    return;

  }


  const current=
    last
    ? Number(last.reading)
    : Number(m.opening);


  const units=
    last
    ? Math.max(
        0,
        current-
        Number(m.opening)
      )
    : 0;


  const data=
    last
    ? calculateMeterBill(
        id,
        last.date
      )
    : {
        unitBill:0,
        fixed:0,
        vat:0,
        actual:0
      };


  document.getElementById(
    "readingPreview"
  ).innerHTML=`

    <div class="stats">

      <div class="stat">
        <small>Opening</small>
        <strong>
          ${fmtNum(m.opening)}
        </strong>
      </div>


      <div class="stat">
        <small>Previous</small>
        <strong>
          ${fmtNum(current)}
        </strong>
      </div>


      <div class="stat">
        <small>Total Unit</small>
        <strong>
          ${fmtNum(units)}
        </strong>
      </div>


      <div class="stat">
        <small>Unit Bill</small>
        <strong>
          ${money(data.unitBill)}
        </strong>
      </div>


      <div class="stat">
        <small>Fixed Charge</small>
        <strong>
          ${money(data.fixed)}
        </strong>
      </div>


      <div class="stat">
        <small>VAT</small>
        <strong>
          ${money(data.vat)}
        </strong>
      </div>


      <div class="stat">
        <small>Actual Bill</small>
        <strong>
          ${money(data.actual)}
        </strong>
      </div>

    </div>

  `;

}


/* =========================
   LATEST READING
========================= */

function loadLatestReading(){

  const id=
    document.getElementById(
      "readingMeter"
    ).value;


  const l=
    latest(id);


  document.getElementById(
    "currentReading"
  ).value=
    l
    ? l.reading
    : "";


  renderPreview();

}


/* =========================
   SAVE READING
========================= */

function saveReading(){

  const id=
    document.getElementById(
      "readingMeter"
    ).value;


  const date=
    document.getElementById(
      "readingDate"
    ).value;


  const value=
    Number(
      document.getElementById(
        "currentReading"
      ).value
    );


  const msg=
    document.getElementById(
      "readingMessage"
    );


  const m=
    meter(id);


  if(
    !date ||
    !Number.isFinite(value) ||
    value<0
  ){

    msg.className="error";

    msg.textContent=
      "তারিখ ও সঠিক Reading দিন।";

    return;

  }


  const prevArr=
    readingsFor(id)
      .filter(
        r=>r.date<date
      );


  const prev=
    prevArr.length
    ? Number(
        prevArr[
          prevArr.length-1
        ].reading
      )
    : Number(m.opening);


  if(value<prev){

    msg.className="error";

    msg.textContent=
      `Reading আগের Reading (${fmtNum(prev)})-এর চেয়ে কম হতে পারবে না।`;

    return;

  }


  const same=
    db.readings.find(
      r=>
        r.meterId===id &&
        r.date===date
    );


  if(same){

    same.reading=value;
    same.createdAt=Date.now();

  }else{

    db.readings.push({

      id:
        "R"+Date.now(),

      meterId:id,

      date,

      reading:value,

      createdAt:Date.now()

    });

  }


  saveDB();

  renderAll();


  const du=
    value-prev;


  const data=
    calculateMeterBill(
      id,
      date
    );


  msg.className="success";

  msg.textContent=
    `Saved! আজকের ব্যবহার ${fmtNum(du)} ইউনিট। `+
    `মোট ${fmtNum(data.units)} ইউনিট। `+
    `Unit Bill ${money(data.unitBill)}, `+
    `Fixed ${money(data.fixed)}, `+
    `VAT ${money(data.vat)}, `+
    `Actual Bill ${money(data.actual)}।`;

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  const id=
    document.getElementById(
      "historyMeter"
    ).value;


  const month=
    document.getElementById(
      "historyMonth"
    ).value;


  const arr=
    readingsFor(id)
      .filter(
        r=>
          !month ||
          r.date.startsWith(month)
      );


  const body=
    document.getElementById(
      "historyBody"
    );


  if(!arr.length){

    body.innerHTML=
      `<tr>
        <td colspan="9" class="empty">
          এই মাসে কোনো Reading নেই।
        </td>
      </tr>`;

    return;

  }


  body.innerHTML=
    arr.map(
      r=>{

        const prevArr=
          readingsFor(id)
            .filter(
              x=>x.date<r.date
            );


        const prev=
          prevArr.length
          ? Number(
              prevArr[
                prevArr.length-1
              ].reading
            )
          : Number(
              meter(id).opening
            );


        const du=
          Math.max(
            0,
            Number(r.reading)-prev
          );


        const data=
          calculateMeterBill(
            id,
            r.date
          );


        return `

        <tr>

          <td>
            ${formatDate(r.date)}
          </td>

          <td>
            ${fmtNum(r.reading)}
          </td>

          <td>
            ${fmtNum(du)}
          </td>

          <td>
            ${fmtNum(data.units)}
          </td>

          <td>
            ${money(data.unitBill)}
          </td>

          <td>
            ${money(data.fixed)}
          </td>

          <td>
            ${money(data.vat)}
          </td>

          <td>
            ${money(data.actual)}
          </td>

          <td>

            <button
              class="danger"
              onclick="deleteReading('${r.id}')">
              Delete
            </button>

          </td>

        </tr>

        `;

      }
    ).join("");

}


/* =========================
   DELETE READING
========================= */

function deleteReading(id){

  if(
    !confirm(
      "এই Reading মুছে ফেলবেন?"
    )
  )
    return;


  db.readings=
    db.readings.filter(
      r=>r.id!==id
    );


  saveDB();

  renderAll();

}


/* =========================
   LOAD SETTINGS
========================= */

function loadSettings(){

  const a=db.meters[0];
  const b=db.meters[1];


  if(a){

    m1name.value=a.name;
    m1number.value=a.number;
    m1opening.value=a.opening;
    m1date.value=a.openingDate;

  }


  if(b){

    m2name.value=b.name;
    m2number.value=b.number;
    m2opening.value=b.opening;
    m2date.value=b.openingDate;

  }


  energyCharge.value=
    db.charges.energy;


  meterRent.value=
    db.charges.rent;


  fixedCharge.value=
    fixedCharge();


  if(
    !vatMonth.value
  )
    vatMonth.value=
      monthISO();


  renderVATTable();

  renderRateRows();

}


/* =========================
   SAVE METER SETTINGS
========================= */

function saveMeterSettings(){

  const vals=[

    {
      name:
        m1name.value.trim()||
        "মিটার–১",

      number:
        m1number.value.trim(),

      opening:
        Number(
          m1opening.value
        )||0,

      openingDate:
        m1date.value||
        todayISO()
    },


    {
      name:
        m2name.value.trim()||
        "মিটার–২",

      number:
        m2number.value.trim(),

      opening:
        Number(
          m2opening.value
        )||0,

      openingDate:
        m2date.value||

    }

  ];


  db.meters[0]=
    Object.assign(

    );

    Object.assign(

    );


  saveDB();

  renderAll();


  meterMessage.className=

/* =========================
   FIXED SETTINGS
========================= */

function updateFixedPreview(){

  const energy=
    Number(
      document.getElementById(
        "energyCharge"
      ).value
    )||0;


  const rent=
    Number(
      document.getElementById(
        "meterRent"
      ).value
    )||0;


  document.getElementById(
    "fixedCharge"
  ).value=
    energy+rent;

document.getElementById(
  "energyCharge"
).addEventListener(
  "input",
  updateFixedPreview
);

  "meterRent"
).addEventListener(
  "input",
  updateFixedPreview
);


function saveFixedSettings(){

  db.charges.energy=
    Number(
      energyCharge.value
    )||0;


  db.charges.rent=
    Number(
      meterRent.value
    )||0;


  saveDB();

  renderAll();


  fixedMessage.className=
    "success";


  fixedMessage.textContent=
    `Fixed Charge সংরক্ষণ হয়েছে। মোট ${money(fixedCharge())}।`;

}


/* =========================
   VAT SAVE
========================= */

function saveVAT(){

  const meterId=
    document.getElementById(
      "vatMeter"
    ).value;


  const month=
    document.getElementById(
      "vatMonth"
    ).value;


  const amount=
    Number(
      document.getElementById(
        "vatAmount"
      ).value
    )||0;


  const msg=
    document.getElementById(
      "vatMessage"
    );


  if(!meterId || !month){

    msg.className="error";

    msg.textContent=
      "মিটার ও মাস নির্বাচন করুন।";

    return;

  }


  const same=
    db.vat.find(
      x=>
        x.meterId===meterId &&
        x.month===month
    );


  if(same){

    same.amount=amount;

  }else{

    db.vat.push({

      meterId,
      month,
      amount

    });

  }


  saveDB();

  renderAll();


  msg.className="success";

  msg.textContent=
    `VAT ${money(amount)} সংরক্ষণ হয়েছে।`;

}


/* =========================
   VAT TABLE
========================= */

function renderVATTable(){

  const body=
    document.getElementById(
      "vatBody"
    );


  if(!db.vat.length){

    body.innerHTML=
      `<tr>
        <td colspan="4" class="empty">
          কোনো VAT দেওয়া হয়নি।
        </td>
      </tr>`;

    return;

  }


  body.innerHTML=
    db.vat
      .slice()
      .sort(
        (a,b)=>
          b.month.localeCompare(
            a.month
          )
      )
      .map(
        (v,i)=>{

          const m=
            meter(v.meterId);


          return `

          <tr>

            <td>
              ${v.month}
            </td>

            <td>
              ${esc(
                m
                ? m.name
                : "মিটার"
              )}
            </td>

            <td>
              ${money(v.amount)}
            </td>

            <td>

              <button
                class="danger"
                onclick="deleteVAT('${v.meterId}','${v.month}')">
                Delete
              </button>

            </td>

          </tr>

          `;

        }
      ).join("");

}


/* =========================
   DELETE VAT
========================= */

function deleteVAT(
  meterId,
  month
){

  if(
    !confirm(
      "এই VAT তথ্য মুছে ফেলবেন?"
    )
  )
    return;


  db.vat=
    db.vat.filter(
      x=>
        !(
          x.meterId===meterId &&
          x.month===month
        )
    );


  saveDB();

  renderAll();

}


/* =========================
   RATE SETTINGS
========================= */

function renderRateRows(){

  rateRows.innerHTML=
    db.rates.map(
      (r,i)=>
      `<div class="rate-row">

        <div>
          <label>From</label>

          <input
            type="number"
            data-rate="${i}"
            data-field="from"
            value="${r.from}"
            min="0">
        </div>


        <div>
          <label>To</label>

          <input
            type="number"
            data-rate="${i}"
            data-field="to"
            value="${r.to}"
            min="0">
        </div>


        <div>
          <label>Rate</label>

          <input
            type="number"
            data-rate="${i}"
            data-field="rate"
            value="${r.rate}"
            min="0"
            step="0.01">
        </div>


        <button
          class="danger"
          onclick="removeRateRow(${i})">
          Remove
        </button>

      </div>`
    ).join("");

}


function addRateRow(){

  const last=
    db.rates[
      db.rates.length-1
    ];


  const from=
    last
    ? Number(last.to)+1
    : 0;


  db.rates.push({

    from,

    to:
      from+24,

    rate:0

  });


  renderRateRows();

}


function removeRateRow(i){

  db.rates.splice(i,1);

  renderRateRows();

}


function saveRates(){

  document
    .querySelectorAll(
      "[data-rate]"
    )
    .forEach(
      el=>{

        const i=
          Number(
            el.dataset.rate
          );


        const f=
          el.dataset.field;


        db.rates[i][f]=
          Number(el.value)||0;

      }
    );


  db.rates.sort(
    (a,b)=>
      a.from-b.from
  );


  saveDB();

  renderAll();


  rateMessage.className=
    "success";


  rateMessage.textContent=
    "Rate Settings সংরক্ষণ হয়েছে।";

}


/* =========================
   BACKUP
========================= */

function backupData(){

  const backup={

    app:
      "Current Bill Tracker",

    version:2,

    exportedAt:
      new Date().toISOString(),

    data:db

  };


  const blob=
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url=
    URL.createObjectURL(
      blob
    );


  const a=
    document.createElement(
      "a"
    );


  a.href=url;


  a.download=
    "current-bill-tracker-backup-"+
    todayISO()+
    ".json";


  a.click();


  URL.revokeObjectURL(url);


  backupMessage.className=
    "success";


  backupMessage.textContent=
    "Backup ফাইল তৈরি হয়েছে।";

}


/* =========================
   RESTORE
========================= */

function restoreData(e){

  const file=
    e.target.files[0];


  if(!file)
    return;


  const reader=
    new FileReader();


  reader.onload=()=>{

    try{

      const x=
        JSON.parse(
          reader.result
        );


      const d=
        x.data||x;


      if(
        !d.meters ||
        !d.rates ||
        !d.readings
      )
        throw new Error(
          "Invalid"
        );


      db=d;


      if(!db.vat)
        db.vat=[];


      if(!db.charges)
        db.charges={
          energy:42,
          rent:10
        };


      if(
        db.charges.energy===undefined
      )
        db.charges.energy=42;


      if(
        db.charges.rent===undefined
      )
        db.charges.rent=10;


      saveDB();

      renderAll();


      backupMessage.className=
        "success";


      backupMessage.textContent=
        "Backup সফলভাবে Restore হয়েছে।";

    }catch(err){

      backupMessage.className=
        "error";


      backupMessage.textContent=
        "Backup ফাইলটি সঠিক নয়।";

    }

  };


  reader.readAsText(file);

}

/* =========================
   DATE FORMAT
========================= */

function formatDate(s){

  if(!s)
    return "-";


  const [
    y,
    m,
    d
  ]=
    s.split("-");


  return d+
    "-"+
    m+
    "-"+
    y;

}


/* =========================
   HTML ESCAPE
========================= */

function esc(s){

  return String(
    s??""
  ).replace(
    /[&<>"']/g,
    c=>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
  );

}
