<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f7f7;
  color:#17202a;
  font-size:16px
}

header{
  background:#0f766e;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 2px 8px #0002
}

header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:14px;opacity:.9}

nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:10px;
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:76px;
  z-index:4
}

nav button{
  white-space:nowrap;
  border:0;
  background:#e7eeee;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
  color:#174b47
}

nav button.active{
  background:#0f766e;
  color:white
}

main{
  max-width:850px;
  margin:auto;
  padding:14px
}

.page{display:none}
.page.active{display:block}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px #00000010
}

.card h2,.card h3{margin:0 0 12px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}

label{
  display:block;
  font-weight:600;
  margin-bottom:6px
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5d5;
  border-radius:10px;
  font-size:16px;
  background:white
}

button{
  font-size:16px;
  cursor:pointer
}

.primary{
  background:#0f766e;
  color:white;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700
}

.secondary{
  background:#e6eeee;
  color:#174b47;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700
}

.danger{
  background:#b91c1c;
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 14px
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.meter-title{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}

.badge{
  background:#e7f5f2;
  color:#0f766e;
  padding:5px 9px;
  border-radius:999px;
  font-size:13px;
  font-weight:700
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
}

.stat{
  background:#f1f6f6;
  border-radius:12px;
  padding:12px
}

.stat small{
  display:block;
  color:#667;
  margin-bottom:4px
}

.stat strong{font-size:20px}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

th,td{
  border-bottom:1px solid #e2e8e8;
  padding:9px 6px;
  text-align:left
}

th{background:#eef4f4}

.table-wrap{overflow:auto}

.notice{
  background:#fff8e1;
  border-left:4px solid #e0a800;
  padding:12px;
  border-radius:8px;
  margin-bottom:12px
}

.success{
  color:#087443;
  font-weight:700
}

.error{
  color:#b91c1c;
  font-weight:700
}

.rate-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:8px
}

@media(max-width:600px){
  .rate-row{grid-template-columns:1fr 1fr}
  .rate-row button{grid-column:1/-1}
}

.empty{
  text-align:center;
  color:#777;
  padding:25px 10px
}

footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:20px
}

.section-title{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #e2e8e8
}
</style>
